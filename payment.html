<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Movie Tickets</a>
    </div>
  </nav>

  <!-- Payment Section -->
  <div class="container mt-5">
    <h3>Payment for <span id="movie-title"></span> at <span id="theater-title"></span></h3>
    <p>Seats: <span id="seat-info"></span></p>
    <div class="row">
      <div class="col-md-12">
        <button class="btn btn-success" onclick="payOnline()">Pay Online</button>
        <button class="btn btn-secondary" onclick="payInTheatre()">Pay in Theatre</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const movie = urlParams.get('movie');
    const theater = urlParams.get('theater');
    const seats = urlParams.get('seats');
    document.getElementById('movie-title').textContent = movie;
    document.getElementById('theater-title').textContent = theater;
    document.getElementById('seat-info').textContent = seats;

    function payInTheatre() {
      window.location.href = `confirmation.html?movie=${movie}&theater=${theater}&seats=${seats}`;
    }
  </script>

</body>
</html>
