<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Seats</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Movie Tickets</a>
    </div>
  </nav>

  <!-- Seat Selection Section -->
  <div class="container mt-5">
    <h3>Select Your Seats for <span id="selected-movie"></span></h3>
    <div class="row">
      <div class="col-md-12">
        <div id="seat-layout">
          <div class="seat-row">
            <button class="seat btn btn-outline-primary" onclick="toggleSeat(this)">A1</button>
            <button class="seat btn btn-outline-primary" onclick="toggleSeat(this)">A2</button>
            <!-- Add more seats as necessary -->
          </div>
          <div class="seat-row">
            <button class="seat btn btn-outline-primary" onclick="toggleSeat(this)">B1</button>
            <button class="seat btn btn-outline-primary" onclick="toggleSeat(this)">B2</button>
          </div>
        </div>
      </div>
      <div class="col-md-12 mt-3">
        <button class="btn btn-primary" onclick="goToPayment()">Proceed to Payment</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const movie = urlParams.get('movie');
    const theater = urlParams.get('theater');
    document.getElementById('selected-movie').textContent = movie;

    let selectedSeats = [];

    // Function to toggle seat selection
    function toggleSeat(seatButton) {
      const seat = seatButton.textContent;
      if (selectedSeats.includes(seat)) {
        selectedSeats = selectedSeats.filter(s => s !== seat);
        seatButton.classList.remove('selected');
      } else {
        selectedSeats.push(seat);
        seatButton.classList.add('selected');
      }
    }

    // Proceed to payment page
    function goToPayment() {
      if (selectedSeats.length === 0) {
        alert("Please select at least one seat.");
        return;
      }
      window.location.href = `payment.html?theater=${theater}&movie=${movie}&seats=${selectedSeats.join(',')}`;
    }
  </script>

</body>
</html>
