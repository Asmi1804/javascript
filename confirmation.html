<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Movie Tickets</a>
    </div>
  </nav>

  <!-- Ticket Confirmation and Download Section -->
  <div class="container mt-5">
    <h3>Your Ticket Summary</h3>
    <p>Movie: <span id="final-movie"></span></p>
    <p>Theater: <span id="final-theater"></span></p>
    <p>Seats: <span id="final-seats"></span></p>
    <button class="btn btn-primary" onclick="downloadPDF()">Download Ticket as PDF</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const movie = urlParams.get('movie');
    const theater = urlParams.get('theater');
    const seats = urlParams.get('seats');
    document.getElementById('final-movie').textContent = movie;
    document.getElementById('final-theater').textContent = theater;
    document.getElementById('final-seats').textContent = seats;

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text(20, 20, 'Movie Ticket');
      doc.text(20, 30, `Movie: ${movie}`);
      doc.text(20, 40, `Theater: ${theater}`);
      doc.text(20, 50, `Seats: ${seats}`);
      doc.save('ticket.pdf');
    }
  </script>

</body>
</html>
