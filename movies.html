<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Movie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Movie Tickets</a>
    </div>
  </nav>

  <!-- Movie Selection Section -->
  <div class="container mt-5">
    <h3 id="theater-title">Movies in </h3>
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <img src="amaran.jpg" class="card-img-top" alt="Amaran">
          <div class="card-body">
            <h5 class="card-title">Amaran</h5>
            <button class="btn btn-primary" onclick="selectMovie('Amaran')">Book Tickets</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <img src="vettaiyan.jpg" class="card-img-top" alt="Vettaiyan">
          <div class="card-body">
            <h5 class="card-title">Vettaiyan</h5>
            <button class="btn btn-primary" onclick="selectMovie('Vettaiyan')">Book Tickets</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Get the theater from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const theater = urlParams.get('theater');
    document.getElementById('theater-title').textContent = 'Movies in ' + theater;

    // Function to select a movie and proceed to the seat selection
    function selectMovie(movie) {
      window.location.href = `seats.html?theater=${theater}&movie=${movie}`;
    }
  </script>

</body>
</html>
